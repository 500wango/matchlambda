# Production stack for one always-on host (see deploy/README.md).
#
# Standalone, not an override of docker-compose.yml: Compose *merges* `volumes`
# lists rather than replacing them, so the dev file's source bind mounts cannot
# be removed by an override — they would leak into production along with
# `uvicorn --reload`. Keeping this file self-contained makes that impossible.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The frontend is deliberately absent: it is a static SPA built for Cloudflare
# Pages (npm --prefix frontend run build:static).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: only the compose network can reach Postgres. Use
    # `docker compose -f docker-compose.prod.yml exec db psql ...` for access.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [backend]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    # No --reload: that belongs to the dev compose.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      # Historical CSVs are gitignored (see .gitignore). Copy data/ to the host
      # before the first deploy, or seeding and backtests report DATA_UNAVAILABLE.
      - ./data:/app/data:ro
    environment: &app_env
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Origin of the Cloudflare Pages site: the only credentialed CORS origin.
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN in .env}
      ALLOW_LOCAL_ORIGINS: "false"
      SHOW_DOCS: "false"
      RUN_MIGRATIONS: "1"
      # Caddy is the only route into the API, so exactly one proxy hop is
      # trusted and it must arrive from this compose network. Getting this wrong
      # is not a small mistake: with hops too low the rate limiter sees Caddy's
      # address and buckets every client together, so one abuser locks out
      # everyone; with hops too high X-Forwarded-For becomes client-controlled.
      TRUSTED_PROXY_HOPS: "1"
      TRUSTED_PROXY_CIDRS: ${COMPOSE_SUBNET:-172.28.0.0/24}
      WEBHOOK_MAX_BODY_BYTES: ${WEBHOOK_MAX_BODY_BYTES:-65536}
      TRIAL_MAX_PER_IP_PER_DAY: ${TRIAL_MAX_PER_IP_PER_DAY:-3}
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      NOWPAYMENTS_IPN_CALLBACK_URL: ${NOWPAYMENTS_IPN_CALLBACK_URL:-}
      PAYMENTS_SANDBOX_MODE: ${PAYMENTS_SANDBOX_MODE:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      THE_ODDS_API_KEY: ${THE_ODDS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [backend]

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 2g
    cpus: "1.5"
    # Two prefork children for two vCPUs. The numpy/scipy tasks are CPU-bound,
    # so more concurrency than cores buys nothing and only adds memory pressure
    # (the dev stack's default is 12, which is not a sensible production value).
    command: celery -A app.core.celery worker --loglevel=info --concurrency=2
    volumes:
      - ./data:/app/data:ro
    environment:
      <<: *app_env
      # Only the api service migrates; a second concurrent `upgrade head` from
      # this container would race it.
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    networks: [backend]

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    command: celery -A app.core.celery beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      <<: *app_env
      RUN_MIGRATIONS: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # The base image's healthcheck probes the API port, which beat does not
    # serve, and beat owns no worker node to ping. Process liveness plus
    # `restart: unless-stopped` is the meaningful signal.
    healthcheck:
      disable: true
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account key. Losing these re-issues on next start
      # and can hit Let's Encrypt rate limits, so keep the volume.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [backend]

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend:
    # Pinned so TRUSTED_PROXY_CIDRS above names a known subnet. Change both
    # together (via COMPOSE_SUBNET) if this range collides with a VPN.
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.28.0.0/24}
